[project]
# The distribution name (what you `pip install`). The import name is `vantage`
# (see [tool.hatch.build.targets.wheel] below); the two differ on purpose, since
# the obvious PyPI names for this project belong to other people.
name = "vantage-observability"
version = "0.1.0"
description = "Instrumentation SDK for the Vantage agent observability platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Parrv Luthra" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/ParrvLuthra22/vantage"
Documentation = "https://docs.vantage.dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantage"]
