id: context_dependent_003
category: context_dependent
complexity: single_step
input: Ok then just open my music app instead.
context:
  prior_turns:
    - user: "Open Spotify."
      response: "I'm sorry, Sir — I don't have a way to control Spotify directly yet."
  active_apps: []
expected:
  routed_agent: open_app
  extracted_entities:
    app_name: Music
  refuse: false
rubric:
  hard_checks:
    - routed_agent_matches
  llm_judge_prompt: |
    Prior turn — user: "Open Spotify." / Vesper: "I'm sorry, Sir — I don't have
    a way to control Spotify directly yet."
    Current user message: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}

    "My music app" refers back to wanting a music player, now redirected to
    whatever's actually available (macOS's built-in "Music" app is the
    reasonable inference). Score:
      5 = calls open_app with a sensible music-app name (e.g. "Music")
      3 = calls open_app but with an odd/wrong app name
      1 = doesn't use the prior turn's context at all
  latency_budget_ms: 20000
notes: |
  Tests entity resolution via context: "my music app" has no explicit name in
  the current turn, only an implied one from the abandoned Spotify request.
