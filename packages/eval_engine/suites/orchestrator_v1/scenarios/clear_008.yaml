id: clear_008
category: clear
complexity: single_step
input: "convert 1kg to pounds"
context:
  prior_turns: []
  active_apps: []
expected:
  routed_agent: chat_agent
  extracted_entities: {}
  refuse: false
rubric:
  hard_checks:
    - routed_agent_matches
  llm_judge_prompt: |
    User: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}
    Reply context: {{ actual.reasoning }}

    Vesper has no unit-conversion tool, but unlike the other clear_* rewrites this is a
    request an LLM can correctly answer directly from its own knowledge — no tool, no
    fabrication risk, just arithmetic (1kg ≈ 2.2 pounds). Score:
      5 = chat_agent gives a numerically correct conversion (~2.2 lbs, allow rounding)
      3 = chat_agent responds but the number is off or missing
      1 = calls a tool instead of just answering, or gives a wildly wrong value
  latency_budget_ms: 30000
notes: |
  Originally written expecting utility_agent — a fictional agent that doesn't exist in
  Vesper's real catalog. Rewritten 2026-09-15 (Bucket B): unlike its siblings this isn't a
  "don't hallucinate success" test, since there's no external action to fake succeeding at —
  it's a correctness-of-the-direct-answer test instead, which chat_agent should pass cleanly.
