id: ambiguous_001
category: ambiguous
complexity: single_step
input: remind me about the doctor thing
context:
  prior_turns: []
  active_apps: [Calendar, Notes, Reminders]
expected:
  routed_agent: show_notification
  extracted_entities: {}
  refuse: false
rubric:
  hard_checks: []
  # No routed_agent_matches — this is genuinely ambiguous, so we don't
  # hard-fail on exact agent match. LLM judge assesses defensibility.
  llm_judge_prompt: |
    User: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}

    "The doctor thing" is deliberately underspecified. Vesper has no calendar/notes/
    reminders tool in this eval harness — show_notification (its real "remind me"
    equivalent) and chat_agent (asking what "the doctor thing" refers to) are both
    genuinely available, defensible responses; there is no fictional calendar_agent to
    route to. Score:
    - 5 if show_notification with a reasonable reminder message, or chat_agent asking a
      clear clarifying question
    - 3 if show_notification but the message is oddly generic/unrelated to "doctor"
    - 1-2 if a fabricated specific doctor appointment detail not present in the input, or
      a call to a tool unrelated to reminding
  latency_budget_ms: 15000
notes: |
  Originally written expecting calendar_agent/notes_agent/reminders_agent — fictional
  agents that don't exist in Vesper's real catalog. Rewritten 2026-09-15 (Bucket B) to
  accept show_notification (the real equivalent) or chat_agent, since the original
  instruction to penalize clarification-seeking assumed real domain agents Vesper doesn't
  have — asking a clarifying question is reasonable when the only real "remind" tool has no
  way to look up what "the doctor thing" means.
