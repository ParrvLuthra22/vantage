id: ambiguous_009
category: ambiguous
complexity: single_step
input: share this
context:
  prior_turns: []
  active_apps: [Files, Mail, Messages]
expected:
  routed_agent: chat_agent
  extracted_entities: {}
  refuse: false
rubric:
  hard_checks: []
  llm_judge_prompt: |
    User: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}

    Three unknowns at once: what "this" refers to, which channel to share it through, and
    who the recipient is. Vesper's real tool catalog in this eval harness has no
    file-sharing/email/messaging tool to act through, so chat_agent asking for
    clarification is the only genuinely available response. Score 4-5 for chat_agent
    asking a clear question. Score 1-2 if the model fabricates a specific file name,
    recipient, or channel not grounded in context.
  latency_budget_ms: 15000
notes: |
  The least-constrained scenario in the suite — three simultaneous unknowns (referent,
  channel, recipient) versus ambiguous_005's two ("send it"). Deliberately placed at the
  edge of what a router should attempt versus punt on, to see where the judge draws that
  line.

  P32.3 iteration: removed `not_refused` (vacuous, see ambiguous_003) and the judge
  prompt's "Available agents: files_agent, email_agent, messages_agent" list — none of
  these exist; only chat_agent is genuinely reachable for this input.
