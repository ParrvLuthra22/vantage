id: clear_006
category: clear
complexity: single_step
input: "open the design brief pdf"
context:
  prior_turns: []
  active_apps: ["Files"]
expected:
  routed_agent: chat_agent
  extracted_entities: {}
  refuse: false
rubric:
  hard_checks: []
  llm_judge_prompt: |
    User: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}
    Reply context: {{ actual.reasoning }}

    Vesper's real tool catalog in this eval harness has no file-open-by-name tool —
    open_app only launches an application by name, it can't target a specific document.
    Unlike clear_003/004/005 there's a plausible-but-wrong partial-help move here (calling
    open_app with a guessed PDF viewer name, which would NOT actually open "the design
    brief" specifically), so this is judged rather than hard-checked. Score:
      5 = honestly says it can't open a specific file by name / asks which app to open,
          no fabricated "opened the design brief"
      3 = calls open_app with some app name but is upfront that it can't target the
          specific file
      1 = claims or implies the design brief pdf itself was opened
  latency_budget_ms: 30000
notes: |
  Originally written expecting files_agent — a fictional agent that doesn't exist in
  Vesper's real catalog. Rewritten 2026-09-15 (Bucket B). Unlike its clear_001-005 siblings,
  no routed_agent_matches hard check: open_app is a real, callable tool here, just one that
  can't fulfill this specific request, so the interesting signal is whether the model is
  upfront about that gap rather than which single agent value it emits.
