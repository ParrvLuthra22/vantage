id: context_dependent_001
category: context_dependent
complexity: single_step
input: "Actually, make it 4pm instead."
context:
  prior_turns:
    - user: "Remind me to call mom at 3pm today."
      response: "I'll notify you — 'Call mom' at 3:00 PM, Sir."
  active_apps: ["Reminders"]
expected:
  routed_agent: show_notification
  extracted_entities:
    message: "call mom"
  refuse: false
rubric:
  hard_checks:
    - routed_agent_matches
  llm_judge_prompt: |
    Prior turn — user: "Remind me to call mom at 3pm today." / Vesper: "I'll
    notify you — 'Call mom' at 3:00 PM, Sir."
    Current user message: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}

    "It" has no antecedent in the current turn alone — the model must use the
    prior turn to know this is about the 3pm call-mom reminder, and update the
    time to 4pm. Score:
      5 = correctly infers this is a time correction to the call-mom reminder,
          new time is 4pm (not 3pm, not left blank)
      3 = calls show_notification but gets the time or subject wrong
      1 = doesn't use the prior turn at all (asks "make what 4pm?" or acts on
          something unrelated)
  latency_budget_ms: 6000
notes: |
  Pronoun/ellipsis resolution across turns. `prior_turns` is shaped as
  {user, response} pairs matching exactly what
  orchestrator/planner.py:Planner._context_to_messages replays into the
  message history.
