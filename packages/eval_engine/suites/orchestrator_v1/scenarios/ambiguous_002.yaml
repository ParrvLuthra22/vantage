id: ambiguous_002
category: ambiguous
complexity: single_step
input: when's my next thing
context:
  prior_turns: []
  active_apps: [Calendar, Reminders]
expected:
  routed_agent: chat_agent
  extracted_entities: {}
  refuse: false
rubric:
  hard_checks: []
  llm_judge_prompt: |
    User: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}

    "My next thing" has no domain word at all — no "meeting", "reminder", or "event". Vesper
    has no calendar/reminders tool in this eval harness, so the only genuinely available,
    non-fabricated response is chat_agent honestly saying it can't check a calendar (or
    asking what "thing" refers to). Score:
    - 5 if chat_agent honestly declines/asks for clarification, no fabricated entities
    - 1-2 if it fabricates a specific upcoming event/task, or calls an unrelated tool
  latency_budget_ms: 15000
notes: |
  Originally written expecting calendar_agent/reminders_agent — fictional agents that don't
  exist in Vesper's real catalog. Rewritten 2026-09-15 (Bucket B): with zero domain
  vocabulary AND no real calendar tool, chat_agent honestly admitting it can't check upcoming
  items is the only defensible outcome, unlike ambiguous_001's "doctor thing" which at least
  maps to show_notification.
