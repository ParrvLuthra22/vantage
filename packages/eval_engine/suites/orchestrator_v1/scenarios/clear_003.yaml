id: clear_003
category: clear
complexity: single_step
input: "play some lo-fi on spotify"
context:
  prior_turns: []
  active_apps: ["Spotify"]
expected:
  routed_agent: music_agent
  extracted_entities:
    genre: lo-fi
    service: spotify
    action: play
  refuse: false
rubric:
  hard_checks:
    - routed_agent_matches
    - not_refused
    - extracted_entities.genre_present
  llm_judge_prompt: |
    User: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}
    Expected agent: {{ expected.routed_agent }}

    Score whether the genre ("lo-fi") and the named external service ("spotify") were both
    picked up, and whether music_agent was chosen rather than a generic app-launcher agent —
    the request is about playback content, not just opening an app.
  latency_budget_ms: 800
notes: |
  Tests brand/service-name extraction ("spotify") alongside a genre slot ("lo-fi"). Purpose:
  confirm the orchestrator distinguishes "play music via a named service" from a bare
  app-open command, which would route differently.
