id: clear_003
category: clear
complexity: single_step
input: play some lo-fi on spotify
context:
  prior_turns: []
  active_apps: [Spotify]
expected:
  routed_agent: open_url
  extracted_entities: {}
  refuse: false
rubric:
  hard_checks: []
  llm_judge_prompt: |
    User: "{{ input }}"
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}
    Reply context: {{ actual.reasoning }}

    Vesper's real tool catalog in this eval harness has no Spotify/music-playback control
    tool. Empirically (docs/vesper_routing_surface.md), real Vesper sometimes substitutes
    a reasonable alternative — e.g. opening a lo-fi stream URL via open_url — rather
    than only ever declining outright; either is an acceptable real outcome here, not
    just one specific one. Score:
      5 = chat_agent honestly declines (no fabricated "now playing" on Spotify), OR
          open_url opens a genuinely on-topic music/stream link (not an unrelated page)
      3 = declines but is confusing about why, or opens a tangentially-related URL
      1 = claims or implies lo-fi music started playing ON SPOTIFY specifically, or opens
          an unrelated URL
  latency_budget_ms: 6000
notes: |
  Originally written expecting music_agent — a fictional agent that doesn't exist in
  Vesper's real catalog. Rewritten 2026-09-15 (Bucket B) to test the same "don't hallucinate
  success" pattern as the out_of_scope_* scenarios, since no playback tool exists to extract
  genre/service entities into.

  P32.3 iteration: direct probe evidence (docs/vesper_routing_probe.json, "music" ->
  open_url, a YouTube lo-fi stream) contradicts the prior hard-checked `chat_agent`
  expectation. Loosened to judge-only since real Vesper's response to this exact style
  of request is plausibly non-deterministic (temperature=0.3, see llm/router.py) —
  hard-checking either single outcome would be fragile.
