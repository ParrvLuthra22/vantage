id: ambiguous_008
category: ambiguous
complexity: single_step
input: "cancel it"
context:
  prior_turns: []
  active_apps: ["Calendar", "Mail"]
expected:
  routed_agent: calendar_agent
  extracted_entities: {}
  refuse: false
rubric:
  hard_checks:
    - not_refused
  llm_judge_prompt: |
    User: "{{ input }}"
    Available agents: calendar_agent (cancel an event), email_agent (cancel/unsend a
    scheduled email).
    Routed to: {{ actual.routed_agent }}, entities: {{ actual.extracted_entities }}

    "Cancel it" applies naturally to both a calendar event and a scheduled email, and with
    no prior_turns there is no way to know which. Score 4-5 for calendar_agent or
    email_agent, 1-2 for an unrelated agent or for inventing details about what is being
    cancelled (a specific event name, time, or email subject) that aren't in context.
  latency_budget_ms: 800
notes: |
  Bare verb-plus-pronoun command with no object noun at all. Tests that the orchestrator
  doesn't overcommit to a specific cancelled entity it has no basis for — the correct
  behavior is picking a defensible target agent, not fabricating what "it" was.
