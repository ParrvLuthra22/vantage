id: clear_001
category: clear
complexity: single_step
input: "book a meeting with priya at 3pm tomorrow"
context:
  prior_turns: []
  active_apps: ["Calendar"]
expected:
  routed_agent: calendar_agent
  extracted_entities:
    subject: priya
    action: create
    time: "3pm tomorrow"
