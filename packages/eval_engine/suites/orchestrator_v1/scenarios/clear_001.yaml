    Given the user input "{{ input }}" the orchestrator routed to {{ actual.routed_agent }}
    and extracted {{ actual.extracted_entities }}.
    Expected routing was {{ expected.routed_agent }}.
    Score 1-5: is this routing decision correct and are the entities well-extracted?
  latency_budget_ms: 800
notes: |
  Clean happy path. Explicit intent, unambiguous entities, single-agent execution.
