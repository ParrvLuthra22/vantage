id: clear_001
category: clear
complexity: single_step
input: "book a meeting with priya at 3pm tomorrow"
context:
  prior_turns: []
  active_apps: ["Calendar", "Messages"]
expected:
  routed_agent: calendar_agent
  extracted_entities:
    subject: priya
    action: create
    time: "3pm tomorrow"
  refuse: false
rubric:
  hard_checks:
    - routed_agent_matches
    - not_refused
    - extracted_entities.subject_present
    - extracted_entities.action_present
    - extracted_entities.time_present
  llm_judge_prompt: |
    User said: "{{ input }}"
    Orchestrator routed to: {{ actual.routed_agent }}
    Extracted: {{ actual.extracted_entities }}
    Expected agent: {{ expected.routed_agent }}

    Score the routing decision on quality:
    - Was the correct agent selected?
    - Were the entities cleanly extracted with correct semantics?
    - Any signs of over-extraction (hallucinated fields) or under-extraction (missing fields)?
  latency_budget_ms: 800
notes: |
  Canonical happy path. Explicit intent word ("meeting"), unambiguous subject (person name),
  explicit time. This should be the easiest possible scenario — if it fails, something is
  fundamentally broken.
