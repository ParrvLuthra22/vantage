[project]
name = "vantage-eval"
version = "0.1.0"
description = "Eval engine — runs scenario suites against Vantage agents and scores the results"
requires-python = ">=3.11"
dependencies = [
    "vantage-sdk",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "openai>=1.50.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
]

[project.scripts]
vantage = "vantage_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantage_eval"]

[tool.uv.sources]
vantage-sdk = { path = "../sdk" }
