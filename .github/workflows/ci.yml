name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: vantage
          POSTGRES_DB: vantage
        ports:
          - 5432:5432
        # The job talks to Postgres over the mapped port, so wait until it is
        # actually accepting connections rather than merely started.
        options: >-
          --health-cmd "pg_isready -U vantage -d vantage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://vantage:vantage@localhost:5432/vantage

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11

      - name: Install packages and dev tooling
        run: |
          uv pip install -e ./packages/api -e ./packages/sdk

          # eval_engine's own metadata can't be resolved on a CI runner: it pins
          # `vesper @ git+...` (the agent under test — not needed here, its tests
          # are marked `integration`) and depends on vantage-observability and
          # vantage-api, which are installed above from this checkout, not PyPI.
          # So install it without dependency resolution and pull its remaining
          # runtime deps straight from its pyproject, keeping that file the single
          # source of truth.
          uv pip install --no-deps -e ./packages/eval_engine
          .venv/bin/python - <<'PY' | uv pip install -r -
          import tomllib

          # Local editable installs (above) and the integration-only agent.
          SKIP = ("vantage-observability", "vantage-api", "vesper")
          with open("packages/eval_engine/pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          print("\n".join(d for d in deps if not d.startswith(SKIP)))
          PY

          # pytest, pytest-asyncio, httpx, ruff, ruamel.yaml — versions live in the
          # root pyproject's [dependency-groups].dev.
          uv pip install --group dev

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .

      # The app no longer creates tables at startup — Alembic owns the schema.
      # This mirrors the production deploy order: migrate, then serve.
      - name: Run migrations
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          alembic upgrade head
          alembic current
        working-directory: packages/api

      # sdk + api + eval_engine (see testpaths in the root pyproject). Tests that
      # need Vesper or an LLM provider are marked `integration` and stay local.
      - name: Test
        run: |
          source .venv/bin/activate
          pytest -q -m "not integration"

      - name: End-to-end smoke
        run: |
          source .venv/bin/activate
          uvicorn vantage_api.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          python examples/vesper_integration/main.py
          bash scripts/verify_week1.sh

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # lib/api/client.ts throws at import time when these are unset, and
          # `next build` imports it. Nothing calls the API during the build.
          VANTAGE_API_URL: http://localhost:8000
          VANTAGE_API_KEY: ci-build-placeholder

  build-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the SDK distribution
        run: uv build
        working-directory: packages/sdk

      - name: Check the built artifacts
        run: |
          uvx twine check dist/*
          ls -l dist
        working-directory: packages/sdk

      - uses: actions/upload-artifact@v4
        with:
          name: vantage-observability-dist
          path: packages/sdk/dist/*
