[project]
name = "vantage"
version = "0.1.0"
description = "Self-hosted evaluation and observability for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    # 0.x minors add and retune lint rules; `~=` keeps CI from going red the day a
    # new ruff ships. Bump deliberately, alongside whatever it flags.
    "ruff~=0.16.3",
    "ruamel.yaml>=0.18.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Migration files are generated by `alembic revision --autogenerate` and are
# immutable history once committed. Reformatting them creates churn that
# autogenerate simply undoes on the next revision.
extend-exclude = [".venv", "dist", "build", "packages/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() in defaults is the documented idiom
    "UP045",  # codebase uses Optional[X] deliberately; both forms are equivalent
]

[tool.pytest.ini_options]
testpaths = [
    "packages/sdk/tests",
    "packages/api/tests",
    "packages/eval_engine/tests",
]
markers = [
    # Needs something CI does not provide (an installed Vesper checkout, a live
    # Groq/OpenAI key, a running agent). CI runs `pytest -m "not integration"`;
    # run these locally with `pytest -m integration`.
    "integration: requires external services or packages (Vesper, LLM provider keys)",
]
